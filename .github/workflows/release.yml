name: Release

# A `v*` tag publishes @wtfalch/design to npm.
#
# Authentication is OIDC trusted publishing: npm is configured to trust this
# repository and this workflow filename, and the job exchanges a GitHub
# identity token for a short-lived publish token. There is no NPM_TOKEN to
# leak, rotate, or forget to set.
#
# No `--provenance`. npm verifies a provenance attestation against the source
# repository and refuses one that points at a private repo ("Unsupported
# GitHub Actions source repository visibility"), which is what every private
# repo here is. The npm *package* is public; the repo behind it is not, and
# provenance is about the second. It was never in effect on any of these
# packages: the published tarballs carry no attestations. Add it back per repo
# if one ever goes public.
#
# Renaming this file breaks publishing until the trusted publisher on
# npmjs.com is updated to match, because the filename is half of what npm
# trusts.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for OIDC; without it npm cannot mint a token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The same gates CI runs. A tag is not a reason to skip them: this is
      # the one build other people install.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The tag is the version. A tag that disagrees with package.json is a
      # release of the wrong thing, and this is where it stops.
      - name: the tag matches the manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./packages/design/package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, package.json says $manifest" >&2
            exit 1
          fi
          echo "publishing $manifest"

      # npm 11.5.1+ is what understands OIDC. The runner's bundled npm can be
      # older than that whatever the Node version, so pin it forward here.
      - run: npm install -g npm@latest

      - name: publish
        run: npm publish --access public
        working-directory: packages/design
